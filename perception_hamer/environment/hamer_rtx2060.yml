name: hamer_rtx2060
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip=24.3.1
  - setuptools<81
  - wheel
  - pip:
      # Pin the official HaMeR Docker combination before Lightning can resolve
      # an incompatible latest torch/CUDA stack.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.2.0+cu118
      - torchvision==0.17.0+cu118
      - numpy==1.26.4
      - opencv-python-headless==4.10.0.84
      - pytorch-lightning==2.2.5
      - torchmetrics==1.4.0.post0
      - smplx==0.1.28
      - yacs==0.1.8
      - timm==0.9.16
      - einops==0.8.0
      - scikit-image==0.22.0
      - chumpy @ git+https://github.com/mattloper/chumpy@9b045ff5d6588a24a0bab52c83f032e2ba433e17
      - pyrender==0.1.45
      - trimesh==4.4.9
      - rich==13.9.4
      - hydra-core==1.3.2
      - webdataset==0.2.100
      - gdown==5.2.0
