  f2link1\" link2=\"handbase_link\" reason=\"Adjacent\"/>\n    <disable_collisions\
  \ link1=\"f3link1\" link2=\"f3link2\" reason=\"Adjacent\"/>\n    <disable_collisions\
  \ link1=\"f3link1\" link2=\"handbase_link\" reason=\"Adjacent\"/>\n    <disable_collisions\
  \ link1=\"f3link2\" link2=\"f3link3\" reason=\"Adjacent\"/>\n    <disable_collisions\
  \ link1=\"handbase_link\" link2=\"link_6\" reason=\"Adjacent\"/>\n    <disable_collisions\
  \ link1=\"link_1\" link2=\"link_2\" reason=\"Adjacent\"/>\n    <disable_collisions\
  \ link1=\"link_2\" link2=\"link_3\" reason=\"Adjacent\"/>\n    <disable_collisions\
