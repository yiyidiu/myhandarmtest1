robot_description_semantic: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!--This\
  \ does not replace URDF, and is not an extension of URDF.\n    This is a format\
  \ for representing semantic information about the robot structure.\n    A URDF file\
  \ must exist for this robot as well, where the joints and the links that are referenced\
  \ are defined\n-->\n<robot name=\"handarm\">\n    <!--GROUPS: Representation of\
  \ a set of joints and links. This can be useful for specifying DOF to plan for,\
  \ defining arms, end effectors, etc-->\n    <!--LINKS: When a link is specified,\
  \ the parent joint of that link (if it exists) is automatically included-->\n  \
  \  <!--JOINTS: When a joint is specified, the child link of that joint (which will\
  \ always exist) is automatically included-->\n    <!--CHAINS: When a chain is specified,\
  \ all the links along the chain (including endpoints) are included in the group.\
  \ Additionally, all the joints that are parents to included links are also included.\
  \ This means that joints along the chain and the parent joint of the base link are\
  \ included in the group-->\n    <!--SUBGROUPS: Groups can also be formed by referencing\
  \ to already defined group names-->\n    <group name=\"abbarm\">\n        <chain\
  \ base_link=\"base_link\" tip_link=\"tool0\"/>\n    </group>\n    <group name=\"\
  hand\">\n        <joint name=\"f1j1\"/>\n        <joint name=\"f1j2\"/>\n      \
  \  <joint name=\"f2j1\"/>\n        <joint name=\"f3j2\"/>\n    </group>\n    <!--GROUP\
  \ STATES: Purpose: Define a named state for a particular group, in terms of joint\
  \ values. This is useful to define states like 'folded arms'-->\n    <group_state\
  \ name=\"up\" group=\"abbarm\">\n        <joint name=\"joint_1\" value=\"0.4675\"\
  />\n        <joint name=\"joint_2\" value=\"-0.4737\"/>\n        <joint name=\"\
  joint_3\" value=\"-0.3083\"/>\n        <joint name=\"joint_4\" value=\"-0.7072\"\
  />\n        <joint name=\"joint_5\" value=\"-0.3808\"/>\n        <joint name=\"\
  joint_6\" value=\"-0.4533\"/>\n    </group_state>\n    <group_state name=\"start1\"\
  \ group=\"hand\">\n        <joint name=\"f1j1\" value=\"0.051\"/>\n        <joint\
  \ name=\"f1j2\" value=\"0.0317\"/>\n        <joint name=\"f2j1\" value=\"0.0227\"\
  />\n        <joint name=\"f3j2\" value=\"0.0363\"/>\n    </group_state>\n    <group_state\
  \ name=\"grasp1\" group=\"hand\">\n        <joint name=\"f1j1\" value=\"3.1196\"\
  />\n        <joint name=\"f1j2\" value=\"0.952\"/>\n        <joint name=\"f2j1\"\
  \ value=\"0.9158\"/>\n        <joint name=\"f3j2\" value=\"0.9067\"/>\n    </group_state>\n\
  \    <group_state name=\"grasp2\" group=\"hand\">\n        <joint name=\"f1j1\"\
  \ value=\"1.57\"/>\n        <joint name=\"f1j2\" value=\"0.6664\"/>\n        <joint\
  \ name=\"f2j1\" value=\"0.6664\"/>\n        <joint name=\"f3j2\" value=\"0.6664\"\
  />\n    </group_state>\n    <!--VIRTUAL JOINT: Purpose: this element defines a virtual\
  \ joint between a robot link and an external frame of reference (considered fixed\
  \ with respect to the robot)-->\n    <virtual_joint name=\"virtual_joint\" type=\"\
  fixed\" parent_frame=\"world\" child_link=\"base_link\"/>\n    <!-- Only true kinematic\
  \ neighbours are exempt. Four close structural\n         assembly pairs are excluded\
  \ from Servo's global proximity scaler but\n         are re-enabled for binary checks\
  \ by full_robot_self_collision_guard. -->\n    <disable_collisions link1=\"base_link\"\
  \ link2=\"link_1\" reason=\"Adjacent\"/>\n    <disable_collisions link1=\"f1link1\"\
  \ link2=\"f1link2\" reason=\"Adjacent\"/>\n    <disable_collisions link1=\"f1link1\"\
