###############################################
# Gazebo-only response-first Servo profile.
#
# This profile deliberately removes collision-distance scaling and Servo's
# joint-velocity low-pass filter so the simulated tool follows the latest hand
# target without the 40 degree plateau seen in the safe profile.  It must never
# be used for a physical robot; the launch path that loads it hard-wires
# enable_robot=false and simulation=true.
###############################################

move_group_name: abbarm
planning_frame: base_link
ee_frame_name: tool0
robot_link_command_frame: base_link

command_in_type: speed_units
cartesian_command_in_topic: /servo_server/delta_twist_cmds
joint_command_in_topic: /servo_server/delta_joint_cmds
command_out_topic: /abbarm_velocity_controller/command
command_out_type: std_msgs/Float64MultiArray
publish_joint_positions: false
publish_joint_velocities: true
publish_joint_accelerations: false

# The upstream controller publishes fresh Twist commands at 50 Hz.  In low
# latency mode Servo calculates and publishes immediately on each arrival.
publish_period: 0.02
low_latency_mode: true
incoming_command_timeout: 0.10
num_outgoing_halt_msgs_to_publish: 4

scale: {linear: 0.25, rotational: 0.25, joint: 0.25}
# For MoveIt Servo's first-order filter, zero is the exact pass-through case.
low_pass_filter_coeff: 0.0
joint_topic: /joint_states
status_topic: /servo_server/status
warning_topic: /servo_server/status
use_gazebo: true

# Intentionally disabled only for response-first Gazebo acceptance.  The safe
# profile remains in servo_abbarm_velocity_safe.yaml with collision checking on.
check_collisions: false
collision_check_rate: 10.0
collision_check_type: threshold_distance
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.03
collision_distance_safety_factor: 1000.0
min_allowable_collision_distance: 0.01

# Avoid condition-number slowdown during this kinematic-response experiment.
# URDF joint limits are still intrinsic to MoveIt/Gazebo.
lower_singularity_threshold: 100.0
hard_stop_singularity_threshold: 200.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margin: 0.0
is_primary_planning_scene_monitor: false
