# ros_control controllers for Gazebo simulation, velocity-servo version.
# Arm: direct joint velocity command for MoveIt Servo.
# Hand: keep original position trajectory controller.
abbarm_velocity_controller:
  type: velocity_controllers/JointGroupVelocityController
  joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

controller_gazebo_hand:
  type: position_controllers/JointTrajectoryController
  joints:
    - f1j1
    - f1j2
    - f2j1
    - f3j2
  gains:
    f1j1: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
    f1j2: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
    f2j1: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
    f3j2: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
  stop_trajectory_duration: 0.1
  state_publish_rate: 50
  action_monitor_rate: 10
