controller_list:
  - name: fake_abbarm_controller
    type: $(arg fake_execution_type)
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
  - name: fake_hand_controller
    type: $(arg fake_execution_type)
    joints:
      - f1j1
      - f1j2
      - f2j1
      - f3j2
initial:  # Define initial robot poses per group
  - group: abbarm
    pose: up
  - group: hand
    pose: start1