# Gazebo-only EGM position-reference emulation controllers.
#
# The arm accepts one latest joint-position vector directly.  There is no
# FollowJointTrajectory goal and therefore no trajectory queue to accumulate.
abbarm_egm_position_controller:
  type: position_controllers/JointGroupPositionController
  joints:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

# Keep the existing independent hand controller unchanged.
controller_gazebo_hand:
  type: position_controllers/JointTrajectoryController
  joints:
    - f1j1
    - f1j2
    - f2j1
    - f3j2
  gains:
    f1j1: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
    f1j2: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
    f2j1: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
    f3j2: {p: 100, d: 1, i: 0.0, i_clamp: 0.0}
  stop_trajectory_duration: 0.1
  state_publish_rate: 50
  action_monitor_rate: 10
