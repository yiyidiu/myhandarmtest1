move_group_name: abbarm
planning_frame: base_link
ee_frame_name: tool0
robot_link_command_frame: base_link

command_in_type: speed_units
cartesian_command_in_topic: /servo_server/delta_twist_cmds
joint_command_in_topic: /servo_server/delta_joint_cmds
# Servo never writes the hardware/simulation controller directly.  The strict
# full-robot guard projects each velocity command through MoveIt's complete
# arm+hand model and is the sole publisher allowed onto the controller topic.
command_out_topic: /full_robot_self_collision_guard/raw_arm_velocity
command_out_type: std_msgs/Float64MultiArray
publish_joint_positions: false
publish_joint_velocities: true
publish_joint_accelerations: false

publish_period: 0.02
low_latency_mode: false
incoming_command_timeout: 0.10
num_outgoing_halt_msgs_to_publish: 4

scale: {linear: 0.25, rotational: 0.25, joint: 0.25}
low_pass_filter_coeff: 2.0
joint_topic: /joint_states
status_topic: /servo_server/status
warning_topic: /servo_server/status
use_gazebo: true

# Stage-one safe simulation default: known-model self/scene collision checking is on.
check_collisions: true
collision_check_rate: 60.0
collision_check_type: threshold_distance
# The three-finger hand's nominal collision geometry has an approximately
# 9 mm non-contact separation. A 30 mm threshold permanently scaled every
# valid command to ~2.7%. Start decelerating at the standard 10 mm self margin;
# actual contact/collision checking remains enabled and fail-closed.
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.03
collision_distance_safety_factor: 1000.0
min_allowable_collision_distance: 0.01

lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margin: 0.10
is_primary_planning_scene_monitor: false
