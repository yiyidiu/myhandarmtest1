# Gazebo velocity-loop gains for the ABB arm only.
#
# DefaultRobotHWSim uses ODE's SetParam("vel") path when these gains are
# absent. In this model that motor reports a target rate but can leave sleeping
# links at an unchanged joint position after Cartesian Servo motion. Supplying
# gains selects VELOCITY_PID, applies effort through SetForce(), and makes the
# reported joint motion follow the 50 Hz JointGroupVelocityController command.
# Gravity remains disabled only in gazebo_handarm_velocity.urdf, so integral
# bias is neither necessary nor desirable in this simulation-only plant.
joint_1: {p: 60.0,  i: 0.0, d: 0.0, i_clamp: 0.0}
joint_2: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
joint_3: {p: 100.0, i: 0.0, d: 0.0, i_clamp: 0.0}
# Small, reversible stiffness trial only: +20%, +25%, +16.7%.  Keep D/I at
# zero until live command-vs-feedback data shows that more damping is needed.
joint_4: {p: 6.0,   i: 0.0, d: 0.0, i_clamp: 0.0}
joint_5: {p: 2.5,   i: 0.0, d: 0.0, i_clamp: 0.0}
joint_6: {p: 3.5,   i: 0.0, d: 0.0, i_clamp: 0.0}
